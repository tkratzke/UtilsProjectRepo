###############################################################################
# Java Util Logging Configuration File
# Comments start with '#' and go to the end of the line.
# This file configures log levels, handlers, and formatters.
###############################################################################

# -----------------------------------------------------------------------------
# GLOBAL LOGGING LEVEL
# -----------------------------------------------------------------------------
# This sets the default logging level for all loggers.
# Levels: SEVERE, WARNING, INFO, CONFIG, FINE, FINER, FINEST, ALL, OFF
.level = SEVERE

# -----------------------------------------------------------------------------
# HANDLERS (OUTPUT DESTINATIONS)
# -----------------------------------------------------------------------------
# List of handlers to be used (comma-separated).
# Common handlers:
#   java.util.logging.ConsoleHandler  - logs to console
#   java.util.logging.FileHandler     - logs to a file
handlers = java.util.logging.ConsoleHandler, java.util.logging.FileHandler

# -----------------------------------------------------------------------------
# CONSOLE HANDLER CONFIGURATION
# -----------------------------------------------------------------------------
java.util.logging.ConsoleHandler.level = FINE
java.util.logging.ConsoleHandler.formatter = java.util.logging.SimpleFormatter

# -----------------------------------------------------------------------------
# FILE HANDLER CONFIGURATION
# -----------------------------------------------------------------------------
# Pattern for log file name. "%u" is a unique number, "%g" is generation number.
java.util.logging.FileHandler.pattern = logs/app.log
java.util.logging.FileHandler.limit = 5000000   # 5 MB per file
java.util.logging.FileHandler.count = 3         # Keep 3 log files
java.util.logging.FileHandler.append = true     # Append to existing logs
java.util.logging.FileHandler.level = FINE
java.util.logging.FileHandler.formatter = java.util.logging.SimpleFormatter

# -----------------------------------------------------------------------------
# FORMATTER CONFIGURATION
# -----------------------------------------------------------------------------
# SimpleFormatter format string:
#   %1$tF %1$tT - date/time
#   %4$s - log level
#   %2$s - source
#   %5$s - message
#   %6$s - throwable
java.util.logging.SimpleFormatter.format = [%1$tF %1$tT] [%4$s] %5$s %n

# -----------------------------------------------------------------------------
# LOGGER-SPECIFIC LEVELS
# -----------------------------------------------------------------------------
# Override logging level for specific packages or classes
com.example.myapp.level = WARNING
com.example.myapp.service.level = FINE
